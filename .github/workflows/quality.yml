name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify locked UI contract
        run: pnpm verify:ui-contract

      - name: Verify Phase 2 foundation contracts and fixtures
        run: pnpm verify:phase-two-foundation

      - name: Verify Phase 3 read-only core fixtures
        run: pnpm verify:phase-three-core

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy -p tools-manager-core --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p tools-manager-core

  desktop-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build frontend assets
        run: pnpm build

      - name: Rust clippy
        run: cargo clippy -p stm-desktop --all-targets -- -D warnings

      - name: Run desktop Phase 4 verification
        run: pnpm verify:phase-four-desktop
