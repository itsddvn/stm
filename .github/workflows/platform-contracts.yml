name: Lifecycle Platform Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/platform-contracts.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "catalog/**"
      - "crates/tools-manager-core/**"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-contracts.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "catalog/**"
      - "crates/tools-manager-core/**"
      - "rust-toolchain.toml"

jobs:
  lifecycle-contracts:
    name: Lifecycle contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run lifecycle core contracts
        run: cargo test -p tools-manager-core

  disposable-homebrew-lifecycle:
    name: Disposable macOS manager lifecycles
    runs-on: macos-latest
    env:
      STM_DISPOSABLE_LIFECYCLE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Exercise generated Homebrew formula lifecycle
        run: cargo test -p tools-manager-core lifecycle::platform_contract_tests::macos::disposable_homebrew_formula_install_rescan_noop_uninstall -- --ignored --exact --nocapture
      - name: Exercise generated Homebrew cask lifecycle
        run: cargo test -p tools-manager-core lifecycle::platform_contract_tests::macos::disposable_homebrew_cask_install_rescan_noop_uninstall -- --ignored --exact --nocapture
      - name: Exercise generated npm lifecycle
        run: cargo test -p tools-manager-core lifecycle::platform_contract_tests::macos::disposable_npm_install_rescan_noop_uninstall -- --ignored --exact --nocapture

  disposable-apt-lifecycle:
    name: Disposable APT lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, rescan, verify no-op, and uninstall with generated APT command
        run: >-
          docker run --rm
          -e STM_DISPOSABLE_LIFECYCLE=1
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          rust:1.88-bookworm
          bash -c "apt-get update && /usr/local/cargo/bin/cargo test -p tools-manager-core
          lifecycle::platform_contract_tests::linux::disposable_apt_install_rescan_noop_uninstall
          -- --ignored --exact --nocapture"

  disposable-dnf-lifecycle:
    name: Disposable DNF lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88.0 and execute generated DNF lifecycle in Fedora
        run: >-
          docker run --rm
          -e STM_DISPOSABLE_LIFECYCLE=1
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          fedora:42
          bash -lc "dnf install --assumeyes curl gcc make &&
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
          sh -s -- -y --profile minimal --default-toolchain 1.88.0 &&
          source /root/.cargo/env &&
          cargo test -p tools-manager-core
          lifecycle::platform_contract_tests::linux::disposable_dnf_install_rescan_noop_uninstall
          -- --ignored --exact --nocapture"

  disposable-pacman-lifecycle:
    name: Disposable Pacman uninstall lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88.0 and exercise reviewed Pacman uninstall in Arch
        run: >-
          docker run --rm
          -e STM_DISPOSABLE_LIFECYCLE=1
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          archlinux:latest
          bash -lc "pacman -Syu --noconfirm curl base-devel git &&
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
          sh -s -- -y --profile minimal --default-toolchain 1.88.0 &&
          source /root/.cargo/env &&
          cargo test -p tools-manager-core
          lifecycle::platform_contract_tests::linux::disposable_pacman_uninstall_rescan
          -- --ignored --exact --nocapture"

  non-root-privilege-denial:
    name: Non-root privilege broker denial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing pkexec degrades reviewed mutation to detect-only
        run: >-
          docker run --rm
          -e STM_DISPOSABLE_LIFECYCLE=1
          -v "${{ github.workspace }}:/workspace:ro"
          -w /workspace
          rust:1.88-bookworm
          bash -c "useradd --create-home stm &&
          mkdir -p /tmp/stm-target /tmp/stm-cargo &&
          chown -R stm:stm /tmp/stm-target /tmp/stm-cargo &&
          su -s /bin/bash stm -c
          'export HOME=/home/stm CARGO_HOME=/tmp/stm-cargo RUSTUP_HOME=/usr/local/rustup
          CARGO_TARGET_DIR=/tmp/stm-target STM_DISPOSABLE_LIFECYCLE=1;
          /usr/local/cargo/bin/cargo test -p tools-manager-core
          lifecycle::service_tests::tests::missing_non_root_privilege_broker_degrades_to_detect_only
          -- --ignored --exact --nocapture'"

  disposable-winget-lifecycle:
    name: Disposable WinGet lifecycle
    runs-on: windows-latest
    env:
      STM_DISPOSABLE_LIFECYCLE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install, rescan, verify no-op, and uninstall with generated WinGet command
        run: cargo test -p tools-manager-core lifecycle::platform_contract_tests::windows::disposable_winget_install_rescan_noop_uninstall -- --ignored --exact --nocapture
