[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/itsddvn/projects/tools-managers"]
capabilities = ["resources", "tools"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
transport = "streamable_http"
tokenAlias = "github-access-token"
capabilities = ["tools", "prompts"]

[mcp_servers.postgres]
url = "https://mcp.example.com/postgres?access_token=secret"
transport = "streamable_http"
tokenAlias = "postgres-service-token"
authRequired = true
disabled = true
capabilities = ["resources", "tools"]
[mcp_servers.postgres.env]
PG_SERVICE_TOKEN = "${PG_SERVICE_TOKEN}"
